# Builds the three images and the Helm chart and publishes them to GitHub Container Registry
# whenever something lands on master. Everything goes into one package, ghcr.io/<owner>/aerothon:
#   images: frontend-latest, backend-latest, db-latest (+ <component>-sha-<commit>)
#   chart:  Chart.yaml's version, e.g. 0.1.0
name: Publish images and Helm chart

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: frontend
            context: flight-navigation-frontend
            dockerfile: flight-navigation-frontend/Dockerfile
          - component: backend
            context: flight-navigation-backend
            dockerfile: flight-navigation-backend/Dockerfile
          - component: db
            context: .
            dockerfile: database/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Registry paths must be lowercase; the GitHub username isn't.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/aerothon
          flavor: |
            prefix=${{ matrix.component }}-,onlatest=true
          tags: |
            type=raw,value=latest
            type=sha,prefix=${{ matrix.component }}-sha-

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  chart:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Package chart
        run: helm package helm/aerothon

      # Pushed as ghcr.io/<owner>/aerothon:<chart version>, alongside the images.
      - name: Push chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push aerothon-*.tgz "oci://ghcr.io/${OWNER}"
