{{- $name := printf "%s-secrets" (include "aerothon.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := .Values.database.password -}}
{{- if not $password -}}
{{- if $existing -}}
{{- $password = index $existing.data "DB_PASSWORD" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 20 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "aerothon.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ $password | quote }}
  WEATHER_API_KEY: {{ .Values.backend.apiKeys.weatherApiKey | quote }}
  AMADEUS_CLIENT_ID: {{ .Values.backend.apiKeys.amadeusClientId | quote }}
  AMADEUS_CLIENT_SECRET: {{ .Values.backend.apiKeys.amadeusClientSecret | quote }}
  AMADEUS_API_KEY: {{ .Values.backend.apiKeys.amadeusApiKey | quote }}
  RAPIDAPI_KEY: {{ .Values.backend.apiKeys.rapidApiKey | quote }}
