{{- $fullname := include "aerothon.fullname" . -}}
{{- with .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "aerothon.labels" $ | nindent 4 }}
    {{- include "aerothon.selector" (list $ "frontend") | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      {{- include "aerothon.selector" (list $ "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aerothon.selector" (list $ "frontend") | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ include "aerothon.image" (list $ .image) }}
          imagePullPolicy: {{ .image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # nginx proxies /api/* here
            - name: BACKEND_URL
              value: http://{{ $fullname }}-backend:5000
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "aerothon.labels" $ | nindent 4 }}
spec:
  selector:
    {{- include "aerothon.selector" (list $ "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
